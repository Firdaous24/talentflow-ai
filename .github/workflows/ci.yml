name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + migrations + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Disposable database for migrations and the /api/v2 tests (no secret: trust auth, job-local network).
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: talentflow_test
          POSTGRES_USER: talentflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentflow_test -d talentflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://talentflow_test@localhost:5432/talentflow_test
      TEST_DATABASE_URL: postgresql+psycopg://talentflow_test@localhost:5432/talentflow_test
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install dependencies (constrained by the Linux lock)
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -c requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Ruff
        run: python -m ruff check app tests migrations *.py
      - name: Migrations are reversible (upgrade, downgrade, upgrade)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Pytest
        run: python -m pytest -p no:cacheprovider -q

  frontend:
    name: Frontend (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway .env from the example
        run: cp .env.example .env
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose.dev.yaml config --quiet
          docker compose -f docker-compose.yml -f compose.test.yaml config --quiet
